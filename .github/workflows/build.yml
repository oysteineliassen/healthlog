name: HealthLog

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

# Et nytt bygg avbryter et eldre som fortsatt kjører på samme gren - ellers kan det
# eldste bli ferdig sist og overskrive APK-en på grenen "apk" med gammel kode.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Tester
        run: ./gradlew testDebugUnitTest --console=plain
      # Egen utgivelsesnøkkel hvis hemmelighetene er lagt inn (se SIGNERING.md) - ellers
      # signeres det med debug-nøkkelen i repoet som før.
      - name: Hent signeringsnøkkel
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "HEALTHLOG_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Bygg APK
        env:
          HEALTHLOG_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          HEALTHLOG_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          HEALTHLOG_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --console=plain
      - name: Gi APK-en et navn med versjon
        run: cp app/build/outputs/apk/release/app-release.apk "HealthLog-1.0.${GITHUB_RUN_NUMBER}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: HealthLog-1.0.${{ github.run_number }}
          path: HealthLog-1.0.${{ github.run_number }}.apk
          retention-days: 3
      # Siste APK fra main legges også på grenen "apk" (én commit, overskrives hver gang),
      # så den kan lastes ned direkte uten å gå via Actions/Artifacts.
      - name: Publiser APK på grenen apk
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/apk && cp "HealthLog-1.0.${GITHUB_RUN_NUMBER}.apk" /tmp/apk/HealthLog.apk
          cd /tmp/apk
          echo "HealthLog 1.0.${GITHUB_RUN_NUMBER} ($(date -u +%F)) fra ${GITHUB_SHA}" > VERSION.txt
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "HealthLog 1.0.${GITHUB_RUN_NUMBER}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-rapport
          path: app/build/reports/tests/
          retention-days: 7
