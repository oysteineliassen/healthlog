name: HealthLog

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Tester
        run: ./gradlew testDebugUnitTest --console=plain
      - name: Bygg APK
        run: ./gradlew assembleRelease --console=plain
      - name: Gi APK-en et navn med versjon
        run: cp app/build/outputs/apk/release/app-release.apk "HealthLog-1.0.${GITHUB_RUN_NUMBER}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: HealthLog-1.0.${{ github.run_number }}
          path: HealthLog-1.0.${{ github.run_number }}.apk
      # Siste APK fra main legges også på grenen "apk" (én commit, overskrives hver gang),
      # så den kan lastes ned direkte uten å gå via Actions/Artifacts.
      - name: Publiser APK på grenen apk
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/apk && cp "HealthLog-1.0.${GITHUB_RUN_NUMBER}.apk" /tmp/apk/HealthLog.apk
          cd /tmp/apk
          echo "HealthLog 1.0.${GITHUB_RUN_NUMBER} ($(date -u +%F)) fra ${GITHUB_SHA}" > VERSION.txt
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "HealthLog 1.0.${GITHUB_RUN_NUMBER}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-rapport
          path: app/build/reports/tests/
