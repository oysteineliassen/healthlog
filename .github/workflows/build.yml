name: HealthLog

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Tester
        run: ./gradlew testDebugUnitTest --console=plain
      - name: Bygg APK
        run: ./gradlew assembleRelease --console=plain
      - name: Gi APK-en et navn med versjon
        run: cp app/build/outputs/apk/release/app-release.apk "HealthLog-1.0.${GITHUB_RUN_NUMBER}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: HealthLog-1.0.${{ github.run_number }}
          path: HealthLog-1.0.${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-rapport
          path: app/build/reports/tests/
